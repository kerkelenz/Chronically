# Render Blueprint — the staging stage, defined in code.
#
#   develop ──▶ staging      (these services)
#   main    ──▶ production   (the existing services, configured in the Render
#                             dashboard to the same shape — see docs/DEPLOYMENT.md)
#
# Production is deliberately not in this file yet: adopting live services into
# a Blueprint is a separate, careful step, and a mistake there could stand up a
# second production instead of managing the first. Once staging has proven this
# file, production can be added alongside it.
#
# Secrets are `sync: false` — Render asks for them once, in the dashboard, and
# they never live in the repo. Everything else is public configuration.

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: chronically-api-staging
    runtime: node
    plan: free # sleeps when idle: the first request after a pause is slow, and
    #            the reminder/weather jobs only tick while it's awake
    region: ohio # next to Supabase us-east-2
    branch: develop
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start # applies pending migrations, then serves
    healthCheckPath: /api/test
    autoDeployTrigger: checksPass # only once CI is green on the commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # the STAGING Supabase project's connection string
        sync: false
      - key: JWT_SECRET # its own secret: a staging token never works in production
        generateValue: true
      - key: RESEND_API_KEY # optional; without it, emails print to the Render log
        sync: false
      - key: FRONTEND_URL
        value: https://chronically-web-staging.onrender.com
      - key: CORS_ORIGINS
        value: https://chronically-web-staging.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: DB_CA_CERT
        sync: false

  # ── Web ─────────────────────────────────────────────────────────────────────
  - type: web
    name: chronically-web-staging
    runtime: static
    branch: develop
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    # a single-page app: every path serves index.html and the router takes over
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex # staging must never show up in search results
    envVars:
      - key: VITE_API_URL
        value: https://chronically-api-staging.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
